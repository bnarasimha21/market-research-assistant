[tool.pytest.ini_options]
markers = [
    "integration: drives the real Flow/Crew/Task machinery end-to-end with FakeLLM (no network, not marked slow)",
    "slow: takes long enough that CI should be allowed to skip it (none yet)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
