# Per-million-token price estimates used only to turn a run's token counts
# into an approximate dollar cost for display (market_research/trace.py and
# app.py). Every entry is a snapshot, not a live lookup: check the source URL
# for the current number before trusting this file for anything beyond a
# rough estimate. Model ids match what DO_MODEL_ID / OPENAI_MODEL_NAME would
# actually be set to, with the provider's "openai/" prefix stripped the same
# way market_research.llm.get_llm builds the LLM (crewai.LLM strips it too).
models:
  llama-3.1-70b-instruct:
    input_per_million_tokens_usd: 0.65
    output_per_million_tokens_usd: 0.65
    source_url: "https://docs.digitalocean.com/products/genai-platform/details/pricing/"
    as_of: "2026-01-10"
    note: "DigitalOcean serverless inference list price, estimate only"
  gpt-4o-mini:
    input_per_million_tokens_usd: 0.15
    output_per_million_tokens_usd: 0.60
    source_url: "https://openai.com/api/pricing/"
    as_of: "2026-01-10"
    note: "OpenAI list price, estimate only"
  fake-llm:
    input_per_million_tokens_usd: 0.0
    output_per_million_tokens_usd: 0.0
    source_url: ""
    as_of: "2026-01-10"
    note: "test/eval double, always free"
